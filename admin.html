<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>곤충 배틀 도감 · 관리자</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap');
  :root{
    --cream:#FFF8EA; --card:#FFFFFF; --ink:#3A2E1F; --ink-soft:#8A7A5E;
    --leaf:#3FA34D; --leaf-dark:#2C7A39; --sun:#FFC83D; --coral:#FF6F59; --coral-dark:#E0503C;
    --sky:#4FC1E0; --line:#E7DCC6;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--cream); color:var(--ink); font-family:'Gowun Dodum',sans-serif; }
  h1,h2,.display{ font-family:'Jua',sans-serif; font-weight:400; }

  /* ---------- 잠금 화면 ---------- */
  #lockScreen{ position:fixed; inset:0; background:var(--ink); display:flex; align-items:center; justify-content:center; z-index:100; }
  .lock-box{ background:var(--card); border-radius:20px; padding:32px 28px; width:90%; max-width:320px; text-align:center; }
  .lock-box h2{ font-size:1.2rem; margin:0 0 6px; color:var(--leaf-dark); }
  .lock-box p{ font-size:.78rem; color:var(--ink-soft); margin:0 0 16px; }
  .lock-box input{ width:100%; padding:10px 12px; border:2px solid var(--line); border-radius:10px; font-size:1rem; text-align:center; margin-bottom:10px; }
  .lock-box button{ width:100%; padding:10px; border:none; border-radius:10px; background:var(--leaf); color:#fff; font-family:'Jua',sans-serif; font-size:.95rem; cursor:pointer; }
  .lock-error{ color:var(--coral-dark); font-size:.78rem; min-height:16px; margin-top:6px; }

  .layout{ display:flex; min-height:100vh; }
  aside{ width:270px; flex-shrink:0; background:#fff; border-right:2px solid var(--line); padding:16px; overflow-y:auto; max-height:100vh; position:sticky; top:0; }
  main{ flex:1; padding:24px 28px; max-width:760px; }
  .app-title{ font-size:1.2rem; color:var(--leaf-dark); margin:0 0 4px; }
  .app-sub{ font-size:.75rem; color:var(--ink-soft); margin:0 0 14px; }
  .notice{ background:#FFF3DC; border:2px solid var(--sun); border-radius:14px; padding:12px 14px; font-size:.8rem; line-height:1.6; margin-bottom:18px; }
  .notice b{ color:var(--coral-dark); }
  .list-item{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none; padding:9px 8px; border-radius:10px; cursor:pointer; font-size:.85rem; color:var(--ink); }
  .list-item:hover{ background:var(--cream); }
  .list-item.active{ background:var(--leaf); color:#fff; }
  .list-item .tag{ font-size:.65rem; opacity:.75; }
  .add-btn{ width:100%; margin-top:10px; padding:10px; border-radius:10px; border:2px dashed var(--line); background:none; color:var(--ink-soft); cursor:pointer; font-size:.85rem; }
  .add-btn:hover{ border-color:var(--leaf); color:var(--leaf-dark); }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:.78rem; font-weight:bold; color:var(--ink-soft); margin-bottom:4px; }
  .field input[type=text], .field input[type=number], .field input[type=password], .field select, .field textarea{
    width:100%; padding:9px 11px; border:2px solid var(--line); border-radius:10px; font-family:inherit; font-size:.9rem; color:var(--ink); background:#fff;
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 90px; gap:12px; }
  .row4{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .check-group{ display:flex; flex-wrap:wrap; gap:8px; }
  .check-group label{ display:flex; align-items:center; gap:4px; font-size:.8rem; background:var(--cream); padding:6px 10px; border-radius:999px; font-weight:normal; cursor:pointer; }
  fieldset{ border:2px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:16px; }
  legend{ font-family:'Jua',sans-serif; font-size:.85rem; color:var(--leaf-dark); padding:0 6px; }
  .skill-row{ display:grid; grid-template-columns:1fr 70px 1fr; gap:8px; margin-bottom:8px; align-items:center; }
  .btn{ font-family:'Jua',sans-serif; border:none; border-radius:999px; cursor:pointer; padding:10px 18px; font-size:.9rem; color:#fff; }
  .btn-leaf{ background:var(--leaf); } .btn-coral{ background:var(--coral); } .btn-sky{ background:var(--sky); }
  .btn-ghost{ background:#fff; color:var(--ink); border:2px solid var(--line); }
  .btn-danger{ background:none; color:var(--coral-dark); border:2px solid var(--coral); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .photo-box{ display:flex; align-items:flex-start; gap:14px; }
  .photo-preview{ width:90px; height:90px; border-radius:14px; background:var(--cream); overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:2px solid var(--line); }
  .photo-preview img{ width:100%; height:100%; object-fit:cover; }
  .small-note{ font-size:.72rem; color:var(--ink-soft); margin-top:4px; }
  .tab-switch{ display:flex; gap:6px; margin-bottom:8px; }
  .tab-switch button{ flex:1; padding:7px; border-radius:8px; border:2px solid var(--line); background:#fff; font-size:.78rem; cursor:pointer; color:var(--ink-soft); }
  .tab-switch button.active{ background:var(--leaf); color:#fff; border-color:var(--leaf); }
  .save-bar{ position:sticky; bottom:0; background:var(--cream); border-top:2px solid var(--line); padding:14px 0; margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  #status{ font-size:.8rem; color:var(--leaf-dark); }
  #status.error{ color:var(--coral-dark); }
  .gh-status{ font-size:.75rem; padding:4px 10px; border-radius:999px; background:var(--cream); color:var(--ink-soft); }
  .gh-status.connected{ background:#E4F4E7; color:var(--leaf-dark); }

  /* ---------- 모바일 반응형 (자동 적용) ---------- */
  @media (max-width: 760px){
    .layout{ flex-direction:column; }
    aside{ width:100%; max-height:none; position:static; border-right:none; border-bottom:3px solid var(--line); padding:12px; }
    aside #insectList{ display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; }
    aside .list-item{ flex-shrink:0; width:auto; white-space:nowrap; }
    main{ padding:16px 14px 90px; max-width:none; }
    .row2, .row3, .row4{ grid-template-columns:1fr; }
    .skill-row{ grid-template-columns:1fr; gap:6px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px dashed var(--line); }
    .photo-box{ flex-direction:column; align-items:stretch; }
    .photo-preview{ width:100%; height:150px; }
    .btn-row{ flex-direction:column; }
    .btn-row .btn{ width:100%; }
    .save-bar{ flex-direction:column; align-items:stretch; }
    .save-bar .btn{ width:100%; }
    fieldset{ padding:12px 10px; }
  }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <h2>🔒 관리자 전용</h2>
    <p>비밀번호를 입력해 주세요</p>
    <input type="password" id="pwInput" placeholder="비밀번호">
    <button id="pwSubmit">입장하기</button>
    <p class="lock-error" id="pwError"></p>
  </div>
</div>

<div class="layout" id="mainLayout" style="display:none">
  <aside>
    <p class="app-title" style="font-size:1rem">🐛 곤충 목록</p>
    <input id="searchList" placeholder="검색..." style="width:100%;padding:7px 10px;border:2px solid var(--line);border-radius:8px;font-size:.8rem;margin-bottom:10px">
    <div id="insectList"></div>
    <button class="add-btn" id="addBtn">+ 새 곤충 추가</button>
  </aside>
  <main>
    <h1 class="app-title">곤충 배틀 도감 · 관리자 페이지</h1>
    <p class="app-sub">내용을 편집한 뒤, GitHub에 바로 저장하거나(연결 필요) JSON 파일로 다운로드해 직접 올릴 수 있어요.</p>

    <fieldset>
      <legend>🔗 GitHub 연결 <span class="gh-status" id="ghStatusChip">연결 안 됨</span></legend>
      <div class="row3">
        <div class="field"><label>저장소 소유자 (username)</label><input type="text" id="gh-owner" placeholder="예: my-github-id"></div>
        <div class="field"><label>저장소 이름</label><input type="text" id="gh-repo" placeholder="예: insect-battle-site"></div>
        <div class="field"><label>브랜치</label><input type="text" id="gh-branch" placeholder="main" value="main"></div>
      </div>
      <div class="field"><label>개인 액세스 토큰 (Contents 권한, 이 저장소 전용 권장)</label><input type="password" id="gh-token" placeholder="github_pat_..."></div>
      <p class="small-note">토큰은 이 브라우저에만 저장돼요(서버로 전송되지 않음). GitHub의 <b>Settings → Developer settings → Fine-grained tokens</b>에서 이 저장소만, <b>Contents: Read and write</b> 권한만 준 토큰을 만들어 사용하세요.</p>
      <div class="btn-row">
        <button class="btn btn-sky" id="ghConnectBtn">연결 저장</button>
        <button class="btn btn-ghost" id="ghDisconnectBtn">연결 해제</button>
      </div>
    </fieldset>

    <div id="formArea"></div>

    <div class="save-bar">
      <button class="btn btn-leaf" id="ghSaveBtn">☁️ GitHub에 저장</button>
      <button class="btn btn-ghost" id="downloadJsonBtn">⬇️ JSON만 다운로드</button>
      <span id="status"></span>
    </div>
  </main>
</div>

<script>
/* ============================== 비밀번호 잠금 ============================== */
/* 기본 비밀번호는 "insect1234" 예요. 바꾸려면: 브라우저 콘솔에서
   crypto.subtle.digest('SHA-256', new TextEncoder().encode('새비밀번호'))
     .then(b => console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
   를 실행해 나온 값을 아래 ADMIN_PASSWORD_HASH에 붙여넣으세요. */
const ADMIN_PASSWORD_HASH = "01e057bdff041c0a87fe11615f5db2e179e4a0a785d3454e20d060710a1ba8e5"; // insect1234

async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2,'0')).join('');
}

async function tryUnlock(){
  const val = document.getElementById('pwInput').value;
  const hash = await sha256Hex(val);
  if (hash === ADMIN_PASSWORD_HASH){
    sessionStorage.setItem('admin_unlocked', '1');
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('mainLayout').style.display = 'flex';
    boot();
  } else {
    document.getElementById('pwError').textContent = '비밀번호가 틀렸어요.';
  }
}
document.getElementById('pwSubmit').addEventListener('click', tryUnlock);
document.getElementById('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

if (sessionStorage.getItem('admin_unlocked') === '1'){
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('mainLayout').style.display = 'flex';
  boot();
}

/* ============================== 데이터 상수 ============================== */
const ORDER_OPTIONS = {
  coleoptera:"딱정벌레목", lepidoptera:"나비목", hymenoptera:"벌목", odonata:"잠자리목",
  orthoptera:"메뚜기목", hemiptera:"매미노린재목", diptera:"파리목", mantodea:"사마귀목", blattodea:"바퀴목"
};
const SHAPE_OPTIONS = ["beetle","butterfly","bee","dragonfly","hopper","truebug","fly","mantis","roach"];
const HAB_OPTIONS = ["숲","나무위","풀숲","물가","습지","도심","땅"];
const TIME_OPTIONS = ["낮","밤","새벽","무관"];
const WEATHER_OPTIONS = ["없음","맑음","비","바람","무더위","흐림"];

let fullData = null;
let insects = [];
let selectedId = null;
let searchTerm = "";
const pendingPhotos = {}; // { insectId: File }
const photoMode = {};     // { insectId: 'url' | 'file' }

/* ============================== GitHub 연결 ============================== */
function ghConfig(){
  return {
    owner: localStorage.getItem('gh_owner') || '',
    repo: localStorage.getItem('gh_repo') || '',
    branch: localStorage.getItem('gh_branch') || 'main',
    token: localStorage.getItem('gh_token') || '',
  };
}
function ghConnected(){ const c = ghConfig(); return !!(c.owner && c.repo && c.token); }

function refreshGhStatusChip(){
  const chip = document.getElementById('ghStatusChip');
  if (ghConnected()){ chip.textContent = '연결됨'; chip.classList.add('connected'); }
  else { chip.textContent = '연결 안 됨'; chip.classList.remove('connected'); }
}

document.getElementById('ghConnectBtn').addEventListener('click', () => {
  const owner = document.getElementById('gh-owner').value.trim();
  const repo = document.getElementById('gh-repo').value.trim();
  const branch = document.getElementById('gh-branch').value.trim() || 'main';
  const token = document.getElementById('gh-token').value.trim();
  if (!owner || !repo || !token){
    setStatus('저장소 소유자, 이름, 토큰을 모두 입력해주세요.', true); return;
  }
  localStorage.setItem('gh_owner', owner);
  localStorage.setItem('gh_repo', repo);
  localStorage.setItem('gh_branch', branch);
  localStorage.setItem('gh_token', token);
  refreshGhStatusChip();
  setStatus('GitHub 연결 정보가 저장되었어요.');
});
document.getElementById('ghDisconnectBtn').addEventListener('click', () => {
  ['gh_owner','gh_repo','gh_branch','gh_token'].forEach(k => localStorage.removeItem(k));
  document.getElementById('gh-owner').value = '';
  document.getElementById('gh-repo').value = '';
  document.getElementById('gh-branch').value = 'main';
  document.getElementById('gh-token').value = '';
  refreshGhStatusChip();
  setStatus('연결 정보를 지웠어요.');
});

async function githubGetSha(path){
  const c = ghConfig();
  const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encodeURIComponent(path).replace(/%2F/g,'/')}?ref=${encodeURIComponent(c.branch)}`;
  const res = await fetch(url, { headers: { Authorization: `token ${c.token}`, Accept: 'application/vnd.github+json' } });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`(${path}) 조회 실패: ${res.status}`);
  const j = await res.json();
  return j.sha;
}

async function githubPutFile(path, base64Content, message){
  const c = ghConfig();
  const sha = await githubGetSha(path);
  const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encodeURIComponent(path).replace(/%2F/g,'/')}`;
  const body = { message, content: base64Content, branch: c.branch };
  if (sha) body.sha = sha;
  const res = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `token ${c.token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok){
    const err = await res.json().catch(() => ({}));
    throw new Error(`(${path}) 저장 실패: ${err.message || res.status}`);
  }
  return res.json();
}

function utf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function saveToGithub(){
  if (!ghConnected()){ setStatus('먼저 GitHub 연결 정보를 저장해주세요.', true); return; }
  setStatus('GitHub에 저장하는 중...');
  try{
    for (const id of Object.keys(pendingPhotos)){
      const file = pendingPhotos[id];
      const insect = insects.find(i => i.id === id);
      if (!insect) continue;
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `images/${id}.${ext}`;
      const base64 = await fileToBase64(file);
      await githubPutFile(path, base64, `사진 추가/교체: ${insect.name}`);
      insect.photoUrl = path;
    }
    const output = Object.assign({}, fullData, { insects });
    await githubPutFile('data/insects.json', utf8ToBase64(JSON.stringify(output, null, 2)), '곤충 데이터 업데이트');
    Object.keys(pendingPhotos).forEach(k => delete pendingPhotos[k]);
    setStatus('✅ GitHub에 저장 완료! 잠시 후 사이트에 반영돼요.');
    renderForm();
  }catch(e){
    setStatus('❌ ' + e.message, true);
  }
}
document.getElementById('ghSaveBtn').addEventListener('click', saveToGithub);

function setStatus(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
}

/* ============================== 데이터 로드 ============================== */
async function boot(){
  document.getElementById('gh-owner').value = localStorage.getItem('gh_owner') || '';
  document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
  document.getElementById('gh-branch').value = localStorage.getItem('gh_branch') || 'main';
  document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
  refreshGhStatusChip();

  try{
    const res = await fetch("data/insects.json");
    fullData = await res.json();
    insects = fullData.insects.filter(i => i && i.id);
  }catch(e){
    fullData = { _readme:"", insects: [] };
    insects = [];
    setStatus('⚠️ data/insects.json을 불러오지 못했어요. (로컬 서버로 열어보세요)', true);
  }
  if (insects.length) selectedId = insects[0].id;
  renderList();
  renderForm();
}

function renderList(){
  const box = document.getElementById("insectList");
  const list = insects.filter(i => i.name.includes(searchTerm));
  box.innerHTML = list.map(i => `
    <button class="list-item ${i.id===selectedId?'active':''}" data-select="${i.id}">
      <span>${i.name || "(이름 없음)"}</span>
      <span class="tag">${ORDER_OPTIONS[i.order]||""}</span>
    </button>`).join("") || `<p style="font-size:.8rem;color:var(--ink-soft)">곤충이 없어요</p>`;
  box.querySelectorAll("[data-select]").forEach(b => {
    b.addEventListener("click", () => { selectedId = b.getAttribute("data-select"); renderList(); renderForm(); });
  });
}

function blankInsect(){
  const id = "new_" + Math.random().toString(36).slice(2,8);
  return { id, name:"", order:"coleoptera", shape:"beetle", photoUrl:null, hab:["숲"], time:"낮",
    stats:{hp:50,atk:50,def:50,spd:50}, features:"", attack:"",
    skills:[{name:"",power:20,desc:""},{name:"",power:20,desc:""},{name:"",power:20,desc:""}] };
}

function renderForm(){
  const area = document.getElementById("formArea");
  const insect = insects.find(i => i.id === selectedId);
  if (!insect){ area.innerHTML = `<p style="color:var(--ink-soft)">왼쪽에서 곤충을 선택하거나 새로 추가하세요.</p>`; return; }

  const mode = photoMode[insect.id] || (insect.photoUrl ? 'url' : 'url');
  const habChecks = HAB_OPTIONS.map(h => `<label><input type="checkbox" data-hab="${h}" ${insect.hab.includes(h)?"checked":""}> ${h}</label>`).join("");

  area.innerHTML = `
    <fieldset>
      <legend>기본 정보</legend>
      <div class="row2">
        <div class="field"><label>이름</label><input type="text" id="f-name" value="${escAttr(insect.name)}"></div>
        <div class="field"><label>고유 id (영문)</label><input type="text" id="f-id" value="${escAttr(insect.id)}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>분류(목)</label>
          <select id="f-order">${Object.entries(ORDER_OPTIONS).map(([k,v])=>`<option value="${k}" ${insect.order===k?"selected":""}>${v}</option>`).join("")}</select>
        </div>
        <div class="field"><label>기본 그림 모양 (사진 없을 때)</label>
          <select id="f-shape">${SHAPE_OPTIONS.map(s=>`<option value="${s}" ${insect.shape===s?"selected":""}>${s}</option>`).join("")}</select>
        </div>
      </div>
      <div class="field"><label>서식지 (1개 이상)</label><div class="check-group" id="f-hab">${habChecks}</div></div>
      <div class="row2">
        <div class="field"><label>활동 시간대</label>
          <select id="f-time">${TIME_OPTIONS.map(t=>`<option value="${t}" ${insect.time===t?"selected":""}>${t}</option>`).join("")}</select>
        </div>
        <div class="field"><label>약한 날씨 (선택)</label>
          <select id="f-weakweather">${WEATHER_OPTIONS.map(w=>`<option value="${w}" ${((insect.weakWeather||"없음")===w)?"selected":""}>${w}</option>`).join("")}</select>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>사진</legend>
      <div class="tab-switch">
        <button type="button" id="modeUrlBtn" class="${mode==='url'?'active':''}">URL 붙여넣기</button>
        <button type="button" id="modeFileBtn" class="${mode==='file'?'active':''}">파일 업로드</button>
      </div>
      <div class="photo-box">
        <div class="photo-preview" id="photoPreview">${insect.photoUrl ? `<img src="${escAttr(insect.photoUrl)}">` : "🐛"}</div>
        <div style="flex:1">
          <div id="urlInputWrap" style="display:${mode==='url'?'block':'none'}">
            <input type="text" id="f-photourl" placeholder="https://... (저작권 없는 이미지 링크)" value="${insect.photoUrl && !pendingPhotos[insect.id] ? escAttr(insect.photoUrl) : ''}" style="width:100%;padding:9px 11px;border:2px solid var(--line);border-radius:10px;">
            <p class="small-note">위키미디어 커먼즈 등 저작권 없는(CC0/CC-BY) 이미지 주소를 붙여넣으세요. GitHub 저장 시 파일 업로드 없이 이 주소만 저장돼요.</p>
          </div>
          <div id="fileInputWrap" style="display:${mode==='file'?'block':'none'}">
            <input type="file" accept="image/*" id="f-photofile">
            <p class="small-note">사진을 고르면 "GitHub에 저장" 시 <code>images/${insect.id}.확장자</code>로 함께 업로드돼요.</p>
          </div>
          <button class="btn btn-ghost" id="clearPhotoBtn" style="margin-top:8px">사진 없이(그림만) 사용</button>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>능력치 (0~100)</legend>
      <div class="row4">
        <div class="field"><label>체력</label><input type="number" id="f-hp" value="${insect.stats.hp}"></div>
        <div class="field"><label>공격</label><input type="number" id="f-atk" value="${insect.stats.atk}"></div>
        <div class="field"><label>방어</label><input type="number" id="f-def" value="${insect.stats.def}"></div>
        <div class="field"><label>속도</label><input type="number" id="f-spd" value="${insect.stats.spd}"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>설명</legend>
      <div class="field"><label>특징</label><textarea id="f-features">${escText(insect.features)}</textarea></div>
      <div class="field"><label>공격 방법</label><textarea id="f-attack">${escText(insect.attack)}</textarea></div>
    </fieldset>

    <fieldset>
      <legend>기술 (3개)</legend>
      ${[0,1,2].map(idx => {
        const s = insect.skills[idx] || {name:"",power:20,desc:""};
        return `<div class="skill-row">
          <input type="text" placeholder="기술 이름" id="f-skill-name-${idx}" value="${escAttr(s.name)}">
          <input type="number" placeholder="위력" id="f-skill-power-${idx}" value="${s.power}">
          <input type="text" placeholder="설명" id="f-skill-desc-${idx}" value="${escAttr(s.desc)}">
        </div>`;
      }).join("")}
    </fieldset>

    <div class="btn-row">
      <button class="btn btn-leaf" id="applyBtn">✔️ 이 내용 반영하기</button>
      <button class="btn btn-danger" id="deleteBtn">이 곤충 삭제</button>
    </div>
  `;

  document.getElementById('modeUrlBtn').addEventListener('click', () => { photoMode[insect.id] = 'url'; renderForm(); });
  document.getElementById('modeFileBtn').addEventListener('click', () => { photoMode[insect.id] = 'file'; renderForm(); });

  const fileInput = document.getElementById('f-photofile');
  if (fileInput){
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      pendingPhotos[insect.id] = file;
      document.getElementById('photoPreview').innerHTML = `<img src="${URL.createObjectURL(file)}">`;
    });
  }
  document.getElementById('clearPhotoBtn').addEventListener('click', () => {
    insect.photoUrl = null;
    delete pendingPhotos[insect.id];
    document.getElementById('photoPreview').innerHTML = '🐛';
    const u = document.getElementById('f-photourl'); if (u) u.value = '';
  });

  document.getElementById("applyBtn").addEventListener("click", () => {
    const newId = document.getElementById("f-id").value.trim();
    insect.name = document.getElementById("f-name").value.trim();
    const oldId = insect.id;
    insect.id = newId || insect.id;
    insect.order = document.getElementById("f-order").value;
    insect.shape = document.getElementById("f-shape").value;
    insect.hab = HAB_OPTIONS.filter(h => document.querySelector(`[data-hab="${h}"]`).checked);
    if (insect.hab.length === 0) insect.hab = ["숲"];
    insect.time = document.getElementById("f-time").value;
    const ww = document.getElementById("f-weakweather").value;
    if (ww === "없음") delete insect.weakWeather; else insect.weakWeather = ww;
    insect.stats = {
      hp:Number(document.getElementById("f-hp").value)||0,
      atk:Number(document.getElementById("f-atk").value)||0,
      def:Number(document.getElementById("f-def").value)||0,
      spd:Number(document.getElementById("f-spd").value)||0,
    };
    insect.features = document.getElementById("f-features").value;
    insect.attack = document.getElementById("f-attack").value;
    insect.skills = [0,1,2].map(idx => ({
      name: document.getElementById(`f-skill-name-${idx}`).value,
      power: Number(document.getElementById(`f-skill-power-${idx}`).value)||0,
      desc: document.getElementById(`f-skill-desc-${idx}`).value,
    }));
    const curMode = photoMode[oldId] || 'url';
    if (curMode === 'url'){
      const urlVal = document.getElementById('f-photourl').value.trim();
      insect.photoUrl = urlVal || null;
      delete pendingPhotos[oldId];
    }
    if (oldId !== insect.id){
      if (pendingPhotos[oldId]){ pendingPhotos[insect.id] = pendingPhotos[oldId]; delete pendingPhotos[oldId]; }
      if (photoMode[oldId]){ photoMode[insect.id] = photoMode[oldId]; delete photoMode[oldId]; }
    }
    selectedId = insect.id;
    setStatus("✔️ 반영됨 (메모리상). GitHub 저장 또는 JSON 다운로드를 눌러주세요.");
    renderList(); renderForm();
  });

  document.getElementById("deleteBtn").addEventListener("click", () => {
    if (!confirm(`'${insect.name}'을(를) 목록에서 삭제할까요?`)) return;
    insects = insects.filter(i => i.id !== insect.id);
    delete pendingPhotos[insect.id];
    selectedId = insects.length ? insects[0].id : null;
    renderList(); renderForm();
  });
}

document.getElementById("searchList").addEventListener("input", (e) => { searchTerm = e.target.value; renderList(); });
document.getElementById("addBtn").addEventListener("click", () => {
  const b = blankInsect();
  insects.push(b);
  selectedId = b.id;
  renderList(); renderForm();
});
document.getElementById("downloadJsonBtn").addEventListener("click", () => {
  const output = Object.assign({}, fullData, { insects });
  const blob = new Blob([JSON.stringify(output, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "insects.json";
  a.click();
  setStatus("⬇️ insects.json 다운로드 완료! data/insects.json에 덮어써 주세요.");
});

function escAttr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function escText(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
</script>
</body>
</html>
