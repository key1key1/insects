<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>곤충 배틀 도감</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap');

  :root{
    --cream:#FFF8EA;
    --card:#FFFFFF;
    --ink:#3A2E1F;
    --ink-soft:#8A7A5E;
    --leaf:#3FA34D;
    --leaf-dark:#2C7A39;
    --sun:#FFC83D;
    --sun-dark:#E0A800;
    --coral:#FF6F59;
    --coral-dark:#E0503C;
    --sky:#4FC1E0;
    --sky-dark:#2E9FBD;
    --line:#FFE3B8;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3, .display{ font-family:'Jua', sans-serif; font-weight:400; }
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }

  .wrap{ max-width:920px; margin:0 auto; padding:0 16px; }

  /* ---------- header ---------- */
  header{ position:sticky; top:0; z-index:20; background:var(--cream); padding-top:14px; padding-bottom:10px; border-bottom:3px solid var(--line); }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-badge{ width:52px; height:52px; border-radius:50%; background:var(--leaf); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 0 var(--leaf-dark); flex-shrink:0; }
  .brand h1{ font-size:1.5rem; margin:0; color:var(--leaf-dark); line-height:1.1; }
  .brand p{ margin:2px 0 0; font-size:.75rem; color:var(--ink-soft); }
  .tabs{ display:flex; gap:10px; margin-top:12px; }
  .tab-btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:9px 6px; border-radius:999px; border:none; font-family:'Jua',sans-serif; font-size:.82rem; cursor:pointer; background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--line); transition:transform .1s; text-align:center; line-height:1.2; }
  .tab-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
  .tab-btn.active.dex{ background:var(--leaf); color:#fff; box-shadow:0 4px 0 var(--leaf-dark); }
  .tab-btn.active.fav{ background:var(--sun); color:#fff; box-shadow:0 4px 0 var(--sun-dark); }
  .tab-btn.active.battle{ background:var(--coral); color:#fff; box-shadow:0 4px 0 var(--coral-dark); }

  /* ---------- buttons (chunky pop style) ---------- */
  .btn{ font-family:'Jua',sans-serif; border:none; border-radius:999px; cursor:pointer; padding:12px 22px; font-size:1rem; color:#fff; transition:transform .08s; display:inline-flex; align-items:center; gap:8px; justify-content:center; }
  .btn:active{ transform:translateY(3px); }
  .btn-leaf{ background:var(--leaf); box-shadow:0 5px 0 var(--leaf-dark); }
  .btn-leaf:active{ box-shadow:0 1px 0 var(--leaf-dark); }
  .btn-coral{ background:var(--coral); box-shadow:0 5px 0 var(--coral-dark); }
  .btn-coral:active{ box-shadow:0 1px 0 var(--coral-dark); }
  .btn-sky{ background:var(--sky); box-shadow:0 5px 0 var(--sky-dark); }
  .btn-sky:active{ box-shadow:0 1px 0 var(--sky-dark); }
  .btn-ghost{ background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--line); }
  .btn-ghost:active{ box-shadow:0 1px 0 var(--line); }
  .btn:disabled{ opacity:.5; cursor:default; }

  /* ---------- search / filter ---------- */
  .search-bar{ display:flex; align-items:center; gap:8px; background:var(--card); border:3px solid var(--line); border-radius:999px; padding:10px 16px; margin:14px 0 10px; }
  .search-bar input{ border:none; outline:none; background:transparent; flex:1; font-family:'Gowun Dodum',sans-serif; font-size:.95rem; color:var(--ink); }
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{ flex-shrink:0; font-family:'Jua',sans-serif; font-size:.8rem; padding:8px 14px; border-radius:999px; border:none; cursor:pointer; color:#fff; opacity:.55; transition:opacity .15s, transform .1s; }
  .chip.active{ opacity:1; transform:scale(1.05); }

  /* ---------- 사진 없는 곤충 목록 (그룹/행) ---------- */
  .group-section{ margin-bottom:6px; }
  .group-header{ font-family:'Jua',sans-serif; font-size:.85rem; margin:14px 0 6px; display:flex; align-items:center; gap:7px; }
  .group-count{ font-size:.68rem; background:var(--cream); padding:1px 8px; border-radius:999px; color:var(--ink-soft); font-family:'Gowun Dodum',sans-serif; }
  .ins-row{ display:flex; align-items:stretch; gap:6px; margin-bottom:7px; }
  .ins-row-main{ flex:1; display:flex; align-items:center; gap:9px; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:11px 13px; cursor:pointer; text-align:left; font-family:'Gowun Dodum',sans-serif; min-width:0; }
  .ins-row-main .dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .ins-row-main .ins-name{ font-family:'Jua',sans-serif; font-size:.92rem; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ins-row-main .ins-hab{ font-size:.85rem; opacity:.85; flex-shrink:0; }
  .star-btn{ width:42px; flex-shrink:0; border:2px solid var(--line); background:var(--card); border-radius:14px; font-size:1.15rem; cursor:pointer; color:#D9C9A8; line-height:1; }
  .star-btn.active{ color:var(--sun-dark); border-color:var(--sun); background:#FFF7E0; }
  .fav-toast{ position:fixed; top:12px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:.82rem; z-index:60; box-shadow:0 4px 10px rgba(0,0,0,.2); }
  .hab-tags{ display:flex; gap:4px; flex-wrap:wrap; }
  .tag-pill{ font-size:.65rem; background:var(--cream); padding:2px 7px; border-radius:999px; color:var(--ink-soft); }

  .modal-head{ display:flex; align-items:center; gap:14px; margin-top:10px; }
  .modal-avatar{ width:84px; height:84px; border-radius:50%; background:var(--cream); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }

  .stat-track{ flex:1; height:12px; border-radius:999px; background:var(--line); overflow:hidden; }
  .stat-fill{ height:100%; border-radius:999px; }
  .stat-num{ width:26px; text-align:right; font-family:'Jua',sans-serif; }
  .section-box{ margin-top:14px; }
  .section-box .head{ font-family:'Jua',sans-serif; font-size:.85rem; margin-bottom:4px; }
  .section-box p{ font-size:.92rem; line-height:1.6; margin:0; }

  .skill-power{ font-family:'Jua',sans-serif; background:#fff; color:var(--coral-dark); font-size:.75rem; padding:4px 9px; border-radius:10px; flex-shrink:0; }
  .skill-item .sname{ font-family:'Jua',sans-serif; font-size:.95rem; }
  .skill-item .sdesc{ font-size:.78rem; color:var(--ink-soft); margin-top:1px; }

  .env-card{ background:var(--card); border:2px dashed var(--line); border-radius:14px; padding:6px 12px; text-align:center; }
  .env-card .ename{ font-family:'Jua',sans-serif; font-size:.82rem; color:var(--leaf-dark); margin:0; }
  .env-card .emeta{ display:flex; justify-content:center; gap:10px; font-size:.7rem; color:var(--ink-soft); margin-top:1px; }
  .vs-row{ display:flex; justify-content:center; gap:28px; margin-bottom:16px; }
  .vs-item{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .vs-avatar{ width:74px; height:74px; border-radius:50%; background:var(--card); border:3px dashed var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .vs-avatar img{ width:100%; height:100%; object-fit:cover; }
  .vs-item .vname{ font-family:'Jua',sans-serif; font-size:.85rem; }
  .action-row{ display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap; }

  .hp-panel{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
  .hp-card{ background:var(--card); border-radius:12px; padding:6px 8px; border:2px solid var(--line); }
  .hp-card .who{ display:flex; align-items:center; gap:5px; margin-bottom:3px; }
  .mini-avatar{ width:18px; height:18px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--cream); display:flex; align-items:center; justify-content:center; }
  .hp-card .who .name{ font-family:'Jua',sans-serif; font-size:.78rem; }
  .hp-track{ height:9px; border-radius:999px; background:var(--line); overflow:hidden; }
  .hp-fill{ height:100%; border-radius:999px; transition:width .35s; }
  .hp-num{ font-size:.62rem; color:var(--ink-soft); margin:2px 0 0; }

  .battle-log{ background:#fff; border:3px solid var(--line); border-radius:16px; padding:10px 12px; height:min(52vh, 480px); overflow-y:auto; font-size:1.05rem; line-height:1.55; margin-bottom:8px; overflow-anchor:none; }
  .battle-log p{ margin:3px 0; }
  .battle-wrap{ max-width:920px; margin:0 auto; padding:8px 12px calc(70px + env(safe-area-inset-bottom)); min-height:100vh; display:flex; flex-direction:column; }
  .battle-top-bar{ display:flex; align-items:center; justify-content:space-between; padding:4px 2px 8px; }
  .battle-top-bar .mini-title{ font-family:'Jua',sans-serif; font-size:.85rem; color:var(--leaf-dark); }

  .skill-btn{ width:100%; text-align:left; background:var(--card); border:3px solid var(--line); border-radius:18px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; margin-bottom:9px; transition:transform .08s; font-family:'Gowun Dodum',sans-serif; }
  .skill-btn:active{ transform:scale(.98); }
  .skill-btn:disabled{ opacity:.5; }
  .skill-btn .sname{ font-family:'Jua',sans-serif; font-size:.95rem; }
  .skill-btn .sdesc{ font-size:.75rem; color:var(--ink-soft); }
  .skill-btn .spower{ font-family:'Jua',sans-serif; background:var(--cream); color:var(--coral-dark); padding:5px 10px; border-radius:10px; flex-shrink:0; }
  .skill-btn .spower.defense{ color:var(--sky-dark); background:#EAFBFF; }
  .trait-tag{ font-family:'Gowun Dodum',sans-serif; font-size:.68rem; font-weight:normal; padding:2px 7px; border-radius:999px; vertical-align:middle; margin-left:2px; }
  .trait-tag.attack{ background:#FFE9E4; color:var(--coral-dark); }
  .trait-tag.defense{ background:#E4F4FF; color:var(--sky-dark); }

  .exit-fab{ position:fixed; left:14px; bottom:14px; z-index:30; background:var(--coral-dark); color:#fff; border:none; border-radius:999px; padding:10px 16px; font-family:'Jua',sans-serif; font-size:.8rem; box-shadow:0 4px 10px rgba(0,0,0,.25); cursor:pointer; }
  .streak-note{ text-align:center; font-size:.72rem; color:var(--ink-soft); margin:-4px 0 8px; }
  footer{ text-align:center; padding:26px 0; font-size:.7rem; color:#c2b190; }
</style>

<script>
/* ============================== 사운드 엔진 (파일 없이 직접 합성) ============================== */
const SoundEngine = (() => {
  let ctx = null;
  function ensureCtx(){
    if (!ctx){
      try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ ctx = null; }
    }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, type="sine", peakVol=0.18, glideTo=null){
    const c = ensureCtx();
    if (!c) return;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime + start);
    if (glideTo) osc.frequency.linearRampToValueAtTime(glideTo, c.currentTime + start + dur);
    gain.gain.setValueAtTime(0, c.currentTime + start);
    gain.gain.linearRampToValueAtTime(peakVol, c.currentTime + start + Math.min(0.02, dur/3));
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(c.currentTime + start);
    osc.stop(c.currentTime + start + dur + 0.02);
  }
  const presets = {
    click:   () => tone(520, 0, 0.05, "square", 0.10),
    tick:    () => tone(700, 0, 0.07, "sine", 0.12),
    hit:     () => { tone(160, 0, 0.13, "sawtooth", 0.22, 90); },
    crit:    () => { tone(220, 0, 0.09, "square", 0.22, 500); tone(700, 0.08, 0.14, "square", 0.18, 950); },
    miss:    () => { tone(500, 0, 0.10, "sine", 0.12, 250); },
    dodge:   () => { tone(600, 0, 0.08, "sine", 0.13, 900); },
    heal:    () => { tone(520, 0, 0.10, "sine", 0.15, 700); tone(760, 0.09, 0.14, "sine", 0.14, 980); },
    fatigue: () => tone(220, 0, 0.16, "sine", 0.12, 140),
    miracle: () => { [520,700,880,1180].forEach((f,i)=> tone(f, i*0.07, 0.11, "triangle", 0.16)); },
    win:     () => { [523,659,784,1046].forEach((f,i)=> tone(f, i*0.11, 0.18, "triangle", 0.20)); },
    draw:    () => { tone(440, 0, 0.14, "sine", 0.15); tone(440, 0.18, 0.14, "sine", 0.15); },
    reveal:  () => tone(880, 0, 0.06, "sine", 0.10),
    start:   () => { tone(300, 0, 0.12, "sawtooth", 0.16, 700); tone(700, 0.1, 0.16, "triangle", 0.16, 1000); },
    neutral: () => tone(600, 0, 0.05, "sine", 0.08),
  };
  function play(name){
    try{ (presets[name] || presets.neutral)(); }catch(e){ /* 오디오 미지원 브라우저는 조용히 무시 */ }
  }
  return { play, ensureCtx };
})();

/* 긴장감 있는 배경 루프 (파일 없이 두 음을 번갈아 재생) */
const BgMusic = (() => {
  let timer = null;
  let step = 0;
  function playPulse(){
    const c = SoundEngine.ensureCtx();
    if (!c) return;
    const notes = [110, 116.5]; // 살짝 불협 관계 = 긴장감
    const freq = notes[step % 2];
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, c.currentTime);
    gain.gain.setValueAtTime(0, c.currentTime);
    gain.gain.linearRampToValueAtTime(0.05, c.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.5);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(); osc.stop(c.currentTime + 0.55);
    step++;
  }
  function start(){
    if (timer) return;
    SoundEngine.ensureCtx();
    playPulse();
    timer = setInterval(playPulse, 620);
  }
  function stop(){
    if (timer){ clearInterval(timer); timer = null; }
  }
  return { start, stop };
})();

/* 음성 안내 (브라우저 내장 TTS, 기기마다 품질/지원이 다를 수 있음) */
function announce(text){
  try{
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    u.rate = 1.05;
    window.speechSynthesis.speak(u);
  }catch(e){ /* 미지원 브라우저는 무시 */ }
}

const HAB_ICON = { 숲:"🌲", 나무위:"🌳", 풀숲:"🌾", 물:"💧", 습지:"🪷", 도심:"🏙️", 땅:"🕳️" };

const ENV_CARDS = [
  { id:"e1", name:"이슬 맺힌 숲속 새벽",     hab:"숲",   time:"새벽", weather:"맑음" },
  { id:"e2", name:"뜨겁게 내리쬐는 한낮 풀숲", hab:"풀숲", time:"낮",   weather:"무더위" },
  { id:"e3", name:"비 내리는 밤의 습지",       hab:"습지", time:"밤",   weather:"비" },

/* 사진 로드 실패 시 SVG 그림으로 자동 대체 (error 이벤트는 버블링되지 않으므로 캡처 단계에서 위임 처리) */
document.addEventListener("error", (e)=>{
  const img = e.target;
  if (img.tagName === "IMG" && img.hasAttribute("data-fallback-shape")){
    const shape = img.getAttribute("data-fallback-shape");
    const color = img.getAttribute("data-fallback-color");
    const size = img.getAttribute("data-fallback-size");
    if (img.parentElement) img.parentElement.innerHTML = glyphSVG(shape, color, size);

/* ============================== 배틀 로직 ============================== */
function envModifiers(insect, env){
  let atkMult=1, defMult=1, spdMult=1; const notes=[];
  if (insect.hab.includes(env.hab)){ atkMult*=1.2; defMult*=1.15; notes.push(`${HAB_ICON[env.hab]} 익숙한 환경이라 공격력과 방어력이 올랐다!`); }
  if (insect.time === env.time){ spdMult*=1.25; notes.push(`${TIME_ICON[env.time]} ${env.time} 시간대라 속도가 빨라졌다!`); }
  if (insect.weakWeather && insect.weakWeather === env.weather){ atkMult*=0.85; defMult*=0.85; spdMult*=0.85; notes.push(`${WEATHER_ICON[env.weather]} ${env.weather} 날씨에 약해져 힘이 빠졌다...`); }
  return { atkMult, defMult, spdMult, notes };
}
function calcDamage(attacker, defender, skill, atkMult, defMult){
  const base = skill.power*0.75 + attacker.stats.atk*0.35;
  const defVal = defender.stats.def*defMult*0.4;
  const floor = Math.max(6, defender.stats.hp*0.05);
  let raw = Math.max(floor, base-defVal);
  raw *= atkMult;
  raw *= 0.9 + Math.random()*0.2;
  const cap = defender.stats.hp*0.33; // 한 방에 상대 체력의 33% 이상은 못 깎음 (즉사 방지)
  raw = Math.min(raw, cap);
  return Math.round(raw);
}
/* 로그 한 줄 + 그 줄에 어울리는 효과음을 함께 담는 헬퍼 */
function L(text, sound){ return { text, sound: sound || "neutral" }; }

/* 종합 전투력 (언더독 보정 판단용) */
function powerScore(insect){
  return insect.stats.hp*0.5 + insect.stats.atk + insect.stats.def*0.5 + insect.stats.spd*0.3;
}

/* 공격기/방어기가 2개 이상일 때, 위력을 비교해 자동으로 특성을 부여
   (데이터를 따로 안 건드리고 위력 숫자만으로 판별) */
function attackVariant(insect, skill){
  const atkSkills = insect.skills.filter(s => s.type === "attack");
  if (atkSkills.length < 2) return "normal";
  const maxPower = Math.max(...atkSkills.map(s => s.power));
  return skill.power < maxPower ? "precise" : "normal";
}
function defenseVariant(insect, skill){
  const defSkills = insect.skills.filter(s => s.type === "defense");
  if (defSkills.length < 2) return "normal";
  const maxPower = Math.max(...defSkills.map(s => s.power));
  return skill.power >= maxPower ? "evasive" : "recovery";
}
/* 방어기가 실제로 회복시킬 양: 데이터에 heal이 명시돼 있으면 그 값 우선,
   아니면 '회복형'일 때만 상대 최대체력의 10%만큼 자동 회복 */
function effectiveDefenseHeal(insect, skill){
  if (skill.heal) return skill.heal;
  if (defenseVariant(insect, skill) === "recovery") return Math.max(4, Math.round(insect.stats.hp * 0.10));
  return 0;
}
/* 기술 옆에 붙일 짧은 특성 단어 (버튼에 표시용) */
function skillTraitLabel(insect, skill){
  if (skill.type === "attack"){
    return attackVariant(insect, skill) === "precise" ? "정밀" : null;
  }
  const v = defenseVariant(insect, skill);
  if (v === "evasive") return "회피";
  if (v === "recovery") return "회복";
  return null;
}

/* 날씨별 기본 불안정도 (명중판정에 사용) */
const WEATHER_MISS_BASE = { 맑음:0.04, 흐림:0.06, 비:0.10, 바람:0.12, 무더위:0.08 };

/* 명중 판정: 빗나감(miss) / 스치듯 맞음(graze) / 제대로 맞음(hit)
   날씨(불안정할수록 위험) · 서식지 일치(불리함 절반으로) · 시간대 일치(정확도↑) ·
   약한 날씨(추가 페널티) · 언더독 보정(강자가 약자에게 방심) ·
   '정밀' 공격기(더 안정적으로 명중)를 모두 반영 */
function computeAttackRoll(attacker, defender, env, skill){
  const habOK = attacker.hab.includes(env.hab);
  const weatherBase = WEATHER_MISS_BASE[env.weather] || 0.05;
  let missChance = 0.06 + weatherBase * (habOK ? 0.4 : 1);
  if (attacker.weakWeather === env.weather) missChance += 0.10;
  if (attacker.time === env.time) missChance -= 0.03;
  const myScore = powerScore(attacker), theirScore = powerScore(defender);
  if (myScore > theirScore * 1.12) missChance += 0.13; // 훨씬 강한 쪽이 방심
  if (skill && attackVariant(attacker, skill) === "precise") missChance -= 0.07; // 정밀 공격 보너스
  missChance = Math.max(0.02, Math.min(0.40, missChance));

  let grazeChance = 0.12 + weatherBase * 0.6 * (habOK ? 0.5 : 1);
  if (skill && attackVariant(attacker, skill) === "precise") grazeChance -= 0.05;
  grazeChance = Math.max(0.03, Math.min(0.30, grazeChance));

  const roll = Math.random();
  if (roll < missChance) return "miss";
  if (roll < missChance + grazeChance) return "graze";
  return "hit";
}
/* 크리티컬: 자기 활동 시간대가 환경과 맞으면 확률↑, 상대보다 훨씬 약할 때(언더독)도 확률↑ */
function rollCrit(attacker, defender, env){
  let chance = 0.15;
  if (attacker.time === env.time) chance += 0.08;
  const myScore = powerScore(attacker), theirScore = powerScore(defender);
  if (myScore < theirScore * 0.92) chance += 0.28; // 언더독 보너스
  return Math.random() < Math.min(0.55, chance);
}
/* 회피: 방어 기술을 썼을 때만 판정. 자기 시간대와 맞거나, 상대보다 빠르면 확률 상승.
   '회피형' 방어기는 추가 보너스를 받음 */
function rollDodge(defender, env, defSpdEff, atkSpdEff, skill){
  let chance = 0.30;
  if (defender.time === env.time) chance += 0.15;
  if (defSpdEff > atkSpdEff) chance += 0.10;
  if (skill && defenseVariant(defender, skill) === "evasive") chance += 0.12;
  return Math.random() < Math.min(0.75, chance);
}

/* 기적의 생존: 상대보다 훨씬 약한(전투력 0.7배 미만) 쪽이 이번 공격으로 쓰러질 뻔하면,
   대결당 한 번만 체력 1로 버텨낸다 */
function applyDamageWithMiracle(ctx, side, dmg){
  const b = state.battle;
  const self = side === "player" ? b.player : b.enemy;
  const opp = side === "player" ? b.enemy : b.player;
  const curHP = side === "player" ? ctx.pHP : ctx.eHP;
  let newHP = Math.max(0, curHP - dmg);
  const usedKey = side === "player" ? "playerMiracleUsed" : "enemyMiracleUsed";
  if (newHP <= 0 && curHP > 0 && !b[usedKey] && powerScore(self) < powerScore(opp) * 0.7){
    b[usedKey] = true;
    newHP = 1;
    ctx.log.push(L(`✨ ${self.name}가 기적적으로 버텨내며 쓰러지지 않았다! (체력 1로 생존)`, "miracle"));
  }
  if (side === "player") ctx.pHP = newHP; else ctx.eHP = newHP;
}

/* 연속 공격 피로 페널티: 공격을 연달아 낼수록 체력이 조금씩 깎임 (죽지는 않음) */
function fatigueFrac(streak){
  if (streak <= 1) return 0;
  if (streak === 2) return 0.03;
  if (streak === 3) return 0.06;
  return 0.10; // 4회 이상
}
function applyFatigue(ctx, side, streak){
  const frac = fatigueFrac(streak);
  if (frac <= 0) return;
  const b = state.battle;
  const self = side === "player" ? b.player : b.enemy;
  const dmg = Math.max(2, Math.round(self.stats.hp * frac));
  if (side === "player") ctx.pHP = Math.max(1, ctx.pHP - dmg);
  else ctx.eHP = Math.max(1, ctx.eHP - dmg);
  ctx.log.push(L(`   … ${self.name}가 연속 공격(${streak}회째)으로 지쳐 체력을 ${dmg} 잃었다.`, "fatigue"));
}

  try{ const v = JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
function isFavorite(id){ return getFavorites().includes(id); }
function toggleFavorite(id){
  let favs = getFavorites();
  if (favs.includes(id)){
    favs = favs.filter(x => x !== id);
  } else {
    if (favs.length >= FAV_MAX){
      state.favMessage = `즐겨찾기는 최대 ${FAV_MAX}종까지 담을 수 있어요!`;
      render();
      setTimeout(() => { state.favMessage = null; render(); }, 1800);
      return;
    }
    favs.push(id);
  }
  try{ localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }catch(e){ /* 저장 공간 문제 등은 조용히 무시 */ }
  render();
}

          <p>서식지가 맞으면 공격력·방어력이 오르고, 활동 시간대가 맞으면 속도·명중률·크리티컬 확률이 올라요. 날씨가 험할수록(비·바람 등) 빗나갈 확률이 오르지만, 자기 서식지에서 싸우면 그 영향이 절반으로 줄어요. '약한 날씨'가 걸리면 능력치가 오히려 낮아져요.</p>
        </div>
        <div class="section-box"><p class="head" style="color:var(--coral-dark)">🎯 명중 판정</p>
          <p>모든 공격은 <b>빗나감 / 스치듯 맞음(피해 절반) / 제대로 맞음</b> 셋 중 하나로 정해져요. 날씨·서식지·시간대에 따라 확률이 달라져요.</p>
        </div>
        <div class="section-box"><p class="head">🏷️ 기술 특성</p>
          <p>기술 이름 옆에 특별한 단어가 붙어 있으면 그 기술엔 위력 숫자 말고도 특별한 장점이 있다는 뜻이에요.</p>
          <p>⚔️ <b>정밀</b>이 붙은 공격기 — 빗나가거나 스치듯 맞을 확률이 크게 줄어서 훨씬 안정적으로 명중해요.</p>
          <p>🛡️ <b>회피</b>가 붙은 방어기 — 상대 공격을 완전히 피할 확률이 크게 올라가요.</p>
          <p>💚 <b>회복</b>이 붙은 방어기 — 맞아도, 안 맞아도 체력을 자동으로 회복해요.</p>
        </div>
        <div class="section-box"><p class="head">💥 크리티컬 &amp; 🛡️ 회피</p>
          <p>제대로 맞았을 땐 15%(+시간대 보너스) 확률로 크리티컬(피해 1.5배)! 방어 기술을 쓰면 30%(+시간대·속도 보너스) 확률로 완전히 피하고, 못 피해도 피해를 65% 줄여요.</p>
        </div>
        <div class="section-box"><p class="head" style="color:var(--sun-dark)">🐜 언더독의 투지</p>
          <p>종합 능력치가 상대보다 많이 낮은 쪽은 이를 악물고 싸워서 크리티컬 확률이 크게 올라요. 반대로 훨씬 강한 쪽은 방심해서 빗나갈 확률이 올라요. 또한 한 번의 공격으로는 상대 체력의 33%까지만 깎을 수 있어서, 아무리 강해도 한 방에 끝내기는 어려워요.</p>
        </div>
        <div class="section-box"><p class="head" style="color:var(--sky-dark)">✨ 기적의 생존</p>
          <p>상대보다 훨씬 약한 곤충은 대결당 딱 한 번, 쓰러질 위기의 순간에 체력 1로 버텨내요.</p>
        </div>
        <div class="section-box"><p class="head">😮‍💨 연속 공격 피로</p>
          <p>공격 기술을 연달아 내면 지쳐서 스스로 체력이 조금씩 줄어요 — 2연속은 살짝, 3연속은 더, 4연속 이상은 가장 많이요. 방어 기술을 한 번 쓰면 초기화돼요. 지쳐서 쓰러지지는 않아요.</p>
        </div>
      </div>
    </div>`;
}

function chipRow(activeKey, includeAll, onSelectAttr){
  let html = `<div class="chip-row">`;
  if (includeAll){
    html += `<button class="chip ${activeKey==='all'?'active':''}" style="background:#8A7A5E" data-${onSelectAttr}="all">전체</button>`;
  }
  Object.entries(ORDER_INFO).forEach(([key,info])=>{
    html += `<button class="chip ${activeKey===key?'active':''}" style="background:${info.color}" data-${onSelectAttr}="${key}">${info.name}</button>`;
  });
  html += `</div>`;
  return html;
}

function insectRow(insect, mainAttrs){
  const info = ORDER_INFO[insect.order];
  const habIcons = insect.hab.map(h => HAB_ICON[h] || "").join(" ");
  const fav = isFavorite(insect.id);
  return `
    <div class="ins-row">
      <button class="ins-row-main" ${mainAttrs}>
        <span class="dot" style="background:${info.color}"></span>
        <span class="ins-name">${esc(insect.name)}</span>
        <span class="ins-hab">${habIcons}</span>
      </button>
      <button class="star-btn ${fav?'active':''}" data-toggle-fav="${insect.id}" title="즐겨찾기">${fav?'★':'☆'}</button>
    </div>`;
}

function groupedInsectList(list, mainAttrFn){
  if (!list.length) return `<div class="empty-msg">일치하는 곤충이 없어요 🐛</div>`;
  const groups = {};
  list.forEach(i => { (groups[i.order] = groups[i.order] || []).push(i); });
  const orderKeys = Object.keys(ORDER_INFO).filter(k => groups[k] && groups[k].length);
  return orderKeys.map(k => `
    <div class="group-section">
      <p class="group-header" style="color:${ORDER_INFO[k].color}">${ORDER_INFO[k].name} <span class="group-count">${groups[k].length}</span></p>
      ${groups[k].map(i => insectRow(i, mainAttrFn(i))).join("")}
    </div>`).join("");
}

function favToast(){
  if (!state.favMessage) return "";
  return `<div class="fav-toast">${esc(state.favMessage)}</div>`;
}

function renderHeader(){
  const favCount = getFavorites().length;
  return `
    <header>
      <div class="wrap">
        <div class="brand" data-set-tab="dex" style="cursor:pointer">
          <div class="brand-badge">${glyphSVG("beetle","#FFF8EA",30)}</div>
          <div>
            <h1>곤충 배틀 도감</h1>
            <p>나만의 곤충 표본을 모으고, 대결도 해보자!</p>
          </div>
        </div>
        <div class="tabs">
          <button class="tab-btn dex ${state.tab==='dex'?'active':''}" data-set-tab="dex">📖 도감</button>
          <button class="tab-btn fav ${state.tab==='favorites'?'active':''}" data-set-tab="favorites">⭐ 즐겨찾기${favCount?` (${favCount})`:""}</button>
          <button class="tab-btn battle ${state.tab==='battle'?'active':''}" data-set-tab="battle">⚔️ 대결</button>
        </div>
      </div>
    </header>`;
}

function filteredInsects(query, orderFilter, excludeId, favOnly){
  return INSECTS.filter(i=>{
    const okOrder = orderFilter==="all" || i.order===orderFilter;
    const okQuery = i.name.includes(query);
    const okExclude = !excludeId || i.id !== excludeId;
    const okFav = !favOnly || isFavorite(i.id);
    return okOrder && okQuery && okExclude && okFav;
  });
}

function renderDex(){
  const list = filteredInsects(state.dex.query, state.dex.orderFilter, null);
  return `
    <div class="wrap">
      <div class="search-bar">
        🔍 <input id="dexSearch" placeholder="곤충 이름으로 찾기" value="${esc(state.dex.query)}">
      </div>
      ${chipRow(state.dex.orderFilter, true, "dex-order")}
      <p style="font-size:.75rem;color:var(--ink-soft);margin:2px 0 10px;">${list.length}종의 표본이 있어요</p>
      <div id="dexGrid">
        ${groupedInsectList(list, i => `data-open-detail="${i.id}"`)}
      </div>
    </div>
    <div id="detailSlot"></div>`;
}

function renderFavorites(){
  const favs = getFavorites().map(id => INSECTS.find(i => i.id === id)).filter(Boolean);
  return `
    <div class="wrap">
      <p class="step-label">⭐ 나만의 표본 (${favs.length}/${FAV_MAX})</p>
      ${favs.length
        ? groupedInsectList(favs, i => `data-open-detail="${i.id}"`)
        : `<div class="empty-msg">아직 담은 곤충이 없어요.<br>도감에서 ☆ 버튼을 눌러 담아보세요!</div>`}
    </div>
    <div id="detailSlot"></div>`;
}

function renderDetailModal(insect){
  if (!insect) return "";
  const info = ORDER_INFO[insect.order];
  const statRow = (label, value, color) => `
    <div class="stat-row"><span class="label">${label}</span>
      <div class="stat-track"><div class="stat-fill" style="width:${value}%;background:${color}"></div></div>
      <span class="stat-num">${value}</span>
    </div>`;
  const skills = insect.skills.map(s=>{
    const trait = skillTraitLabel(insect, s);
    return `
    <div class="skill-item">
      <span class="skill-power">${s.type==='defense' ? '🛡️' : s.power}</span>
      <div><div class="sname">${esc(s.name)}${trait ? ` <span class="trait-tag ${s.type}">${trait}</span>` : ""}</div><div class="sdesc">${esc(s.desc)}</div></div>
    </div>`;
  }).join("");
  const habTags = insect.hab.map(h=>`<span class="tag-pill">${HAB_ICON[h]} ${h}</span>`).join("");

  return `
    <div class="modal-overlay" onclick="closeDetail()">
      <div class="modal-card" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeDetail()">✕</button>
        <p class="modal-breadcrumb" style="color:${info.color}">곤충강 › ${info.name} › ${esc(insect.name)}</p>
        <div class="modal-head">
          <div class="modal-avatar">${avatarHTML(insect, 60)}</div>
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:8px">
              <h2 style="margin:0">${esc(insect.name)}</h2>
              <button class="star-btn ${isFavorite(insect.id)?'active':''}" data-toggle-fav="${insect.id}" title="즐겨찾기" style="margin-left:auto">${isFavorite(insect.id)?'★':'☆'}</button>
            </div>
            <div class="hab-tags" style="margin-top:4px">${habTags}<span class="tag-pill">${TIME_ICON[insect.time]} ${insect.time}</span></div>
          </div>
        </div>
        <div style="margin-top:14px">
          ${statRow("체력", insect.stats.hp, "var(--leaf)")}
          ${statRow("공격", insect.stats.atk, "var(--coral)")}
          ${statRow("방어", insect.stats.def, "var(--sky)")}
          ${statRow("속도", insect.stats.spd, "var(--sun)")}
        </div>
        <div class="section-box"><p class="head" style="color:var(--leaf-dark)">🔍 특징</p><p>${esc(insect.features)}</p></div>
        <div class="section-box"><p class="head" style="color:var(--coral-dark)">⚔️ 공격 방법</p><p>${esc(insect.attack)}</p></div>
        <div class="section-box"><p class="head">✨ 기술</p>${skills}</div>
      </div>
    </div>`;
}

function envCardHTML(env){
  return `
    <div class="env-card">
      <p class="ename">${env.name}</p>
      <div class="emeta">
        <span>${HAB_ICON[env.hab]} ${env.hab}</span>
        <span>${TIME_ICON[env.time]} ${env.time}</span>
        <span>${WEATHER_ICON[env.weather]} ${env.weather}</span>
      </div>
    </div>`;
}

function renderBattle(){
  const b = state.battle;

  if (b.phase === "mode-select"){
    return `
      <div class="wrap battle-wrap" style="text-align:center">
        <p class="step-label">누구와 대결할까요?</p>
        <div class="action-row" style="flex-direction:column;align-items:center;gap:10px">
          <button class="btn btn-sky" data-set-mode="pvc" style="width:100%;max-width:320px">🤖 컴퓨터와 대결 (1인용)</button>
          <button class="btn btn-coral" data-set-mode="pvp" style="width:100%;max-width:320px">🧑‍🤝‍🧑 친구와 대결 (2인용 · 같은 기기)</button>
        </div>
      </div>`;
  }

  if (b.phase === "pick-player" || b.phase === "pick-enemy"){
    const excludeId = b.phase==="pick-enemy" ? b.player.id : null;
    const list = filteredInsects(state.dex.query, b.pickOrderFilter, excludeId, b.pickFavOnly);
    const role = b.phase==='pick-player' ? 'player' : 'enemy';
    let label;
    if (b.phase === "pick-player") label = b.mode==="pvp" ? "1️⃣ 플레이어 1, 곤충을 선택하세요" : "1️⃣ 내 곤충을 선택하세요";
    else label = b.mode==="pvp" ? "2️⃣ 플레이어 2, 곤충을 선택하세요" : "2️⃣ 상대(컴퓨터) 곤충을 선택하세요";
    const favCount = getFavorites().length;
    return `
      <div class="wrap battle-wrap">
        <p class="step-label">${label}</p>
        ${b.phase==="pick-enemy" ? `
          <div class="action-row" style="margin-bottom:12px">
            ${b.mode==="pvc" ? `<button class="btn btn-sky" data-random-enemy="1">🎲 랜덤 상대 뽑기</button>` : ``}
            <button class="btn btn-ghost" data-back-to-pick-player="1">← 다시 선택</button>
          </div>` : ``}
        <div class="chip-row">
          <button class="chip ${!b.pickFavOnly?'active':''}" style="background:#8A7A5E" data-set-pick-fav="0">전체</button>
          <button class="chip ${b.pickFavOnly?'active':''}" style="background:var(--sun-dark)" data-set-pick-fav="1">⭐ 즐겨찾기 (${favCount})</button>
        </div>
        ${chipRow(b.pickOrderFilter, true, "pick-order")}
        <div>
          ${groupedInsectList(list, i => `data-pick-insect="${i.id}" data-pick-role="${role}"`)}
        </div>
      </div>`;
  }

  if (b.phase === "draw-env"){
    return `
      <div class="wrap battle-wrap" style="text-align:center">
        <p class="step-label">3️⃣ 환경 카드를 뽑아보세요</p>
        <div class="vs-row">
          <div class="vs-item"><div class="vs-avatar">${avatarHTML(b.player,44)}</div><p class="vname">${esc(b.player.name)}</p></div>
          <div class="vs-item"><div class="vs-avatar">${avatarHTML(b.enemy,44)}</div><p class="vname">${esc(b.enemy.name)}</p></div>
        </div>
        ${b.env ? envCardHTML(b.env) : `<div class="env-card"><p style="color:var(--ink-soft);margin:0">아직 카드를 뽑지 않았어요</p></div>`}
        <div class="action-row">
          <button class="btn btn-sky" data-draw-env="1" ${b.drawing?"disabled":""}>✨ ${b.drawing? "뽑는 중...": (b.env? "다시 뽑기":"환경 카드 뽑기!")}</button>
          ${b.env && !b.drawing ? `<button class="btn btn-coral" data-start-battle="1">대결 시작 ⚔️</button>` : ``}
        </div>
      </div>`;
  }

  if (b.phase === "battling" || b.phase === "result"){
    let bodyHtml = "";
    if (b.phase === "battling"){
      if (b.turnStage === "handoff"){
        bodyHtml = `
          <div style="text-align:center;padding:30px 10px">
            <p style="font-size:2rem;margin:0 0 8px">🙈</p>
            <p style="font-family:'Jua',sans-serif;font-size:1.05rem;color:var(--leaf-dark)">플레이어 2에게 기기를 넘겨주세요</p>
            <p style="font-size:.8rem;color:var(--ink-soft);margin:6px 0 16px">플레이어 1이 고른 기술은 보이지 않아요. 화면을 확인한 뒤 계속해주세요.</p>
            <button class="btn btn-coral" data-continue-handoff="1">확인했어요, 계속하기 →</button>
          </div>`;
      } else if (b.turnStage === "resolving"){
        bodyHtml = b.busy ? `
          <div style="text-align:center;padding:20px 0">
            <p style="font-family:'Jua',sans-serif;color:var(--leaf-dark);margin:0">⚔️ 공개하는 중...</p>
          </div>` : `
          <div style="text-align:center;padding:20px 0">
            <p style="font-family:'Jua',sans-serif;color:var(--leaf-dark);margin:0 0 14px">🔓 두 곤충 모두 기술을 골랐어요!</p>
            <button class="btn btn-coral" data-resolve-round="1">⚔️ 결과 공개하기!</button>
          </div>`;
      } else if (b.turnStage === "cpu-thinking"){
        bodyHtml = `<p style="text-align:center;padding:30px 0;color:var(--ink-soft)">🤖 상대가 기술을 고르는 중...</p>`;
      } else {
        const side = b.turnStage === "p2-choose" ? "enemy" : "player";
        const actor = side === "player" ? b.player : b.enemy;
        const isHumanTurn = side === "player" || b.mode === "pvp";
        const turnLabel = isHumanTurn
          ? `🎯 ${esc(actor.name)}${b.mode==="pvp" ? (side==="player" ? " (플레이어 1)" : " (플레이어 2)") : ""}, 기술을 고르세요!`
          : `🤖 ${esc(actor.name)}가 기술을 고르는 중...`;
        const streak = side === "player" ? b.playerAtkStreak : b.enemyAtkStreak;
        bodyHtml = `
          <p style="text-align:center;font-family:'Jua',sans-serif;color:var(--leaf-dark);margin:2px 0 10px">${turnLabel}</p>
          ${streak >= 2 ? `<p class="streak-note">😮‍💨 공격을 ${streak}번 연달아 냈어요 — 한 번 더 공격하면 더 지쳐요. 방어로 초기화할 수 있어요.</p>` : ``}
          ${isHumanTurn ? `
          <div>
            ${actor.skills.map((s,idx)=>{
              const trait = skillTraitLabel(actor, s);
              return `
              <button class="skill-btn" data-use-skill-side="${side}" data-use-skill-idx="${idx}" ${b.busy?"disabled":""}>
                <div><div class="sname">${esc(s.name)}${trait ? ` <span class="trait-tag ${s.type}">${trait}</span>` : ``}</div><div class="sdesc">${esc(s.desc)}</div></div>
                <span class="spower ${s.type==='defense'?'defense':''}">${s.type==='defense' ? '🛡️ 방어' : '⚔️ '+s.power}</span>
              </button>`;
            }).join("")}
          </div>` : `<p style="text-align:center;color:var(--ink-soft);font-size:.85rem">잠시만 기다려주세요...</p>`}`;
      }
    } else {
      bodyHtml = `
        <div class="result-banner">
          <p class="big">${b.winner==="무승부" ? "🤝 무승부!" : `🏆 ${esc(b.winner)}의 승리!`}</p>
          <div class="action-row">
            <button class="btn btn-leaf" data-reset-battle="1">🔄 처음부터</button>
            <button class="btn btn-sun" style="background:var(--sun);box-shadow:0 5px 0 var(--sun-dark)" data-rematch="1">같은 곤충으로 재대결</button>
          </div>
        </div>`;
    }
    return `
      <div class="wrap battle-wrap">
        <div style="margin-bottom:6px">${envCardHTML(b.env)}</div>
        <div class="hp-panel">
          <div class="hp-card">
            <div class="who"><div class="mini-avatar">${avatarHTML(b.player,18)}</div><span class="name">${esc(b.player.name)}</span></div>
            <div class="hp-track"><div class="hp-fill" style="width:${(b.playerHP/b.player.stats.hp)*100}%;background:var(--leaf)"></div></div>
            <p class="hp-num">${b.playerHP} / ${b.player.stats.hp}</p>
          </div>
          <div class="hp-card">
            <div class="who"><div class="mini-avatar">${avatarHTML(b.enemy,18)}</div><span class="name">${esc(b.enemy.name)}</span></div>
            <div class="hp-track"><div class="hp-fill" style="width:${(b.enemyHP/b.enemy.stats.hp)*100}%;background:var(--coral)"></div></div>
            <p class="hp-num">${b.enemyHP} / ${b.enemy.stats.hp}</p>
          </div>
        </div>
        <div class="battle-log" id="battleLog">${b.log.map(l=>`<p>${esc(l.text)}</p>`).join("")}</div>
        ${bodyHtml}
      </div>`;
  }
  return "";
}

function render(){
  /* 기술 적용마다 app.innerHTML 전체가 새로 그려지므로, battle-log도 매번 새 DOM 요소로 교체된다.
     그 전에 "사용자가 바닥 근처에 있었는지"를 기억해두고, 다시 그린 뒤 그 상태에 맞게 스크롤을 복원한다.
     -> 바닥 근처였다면 계속 바닥에 붙여두고, 위로 스크롤해서 과거 기록을 보던 중이었다면 그 위치를 유지한다. */
  const prevLogEl = document.getElementById("battleLog");
  let logScroll = null;
  if (prevLogEl){
    const nearBottom = prevLogEl.scrollHeight - prevLogEl.scrollTop - prevLogEl.clientHeight < 40;
    logScroll = { nearBottom, scrollTop: prevLogEl.scrollTop };
  }

  let body = "";
  if (dataSource === "loading"){
    body = `<div class="load-error">🐞 곤충 데이터를 불러오는 중...</div>`;
  } else if (dataSource === "error"){
    body = `<div class="wrap load-error">
      <p style="font-size:2rem;margin:0 0 10px">📭</p>
      <p style="font-family:'Jua',sans-serif;font-size:1rem;color:var(--ink)">데이터를 불러오지 못했어요</p>
      <p style="font-size:.85rem">이 파일을 더블클릭해서 열면 <b>insects.json</b>을 못 불러올 수 있어요.<br>
      GitHub Pages에 올리거나, 로컬 서버(예: <code>python3 -m http.server</code>)로 열어보세요.</p>
      <button class="btn btn-leaf" style="margin-top:14px" data-load-fallback="1">일단 샘플 4종으로 미리보기</button>
    </div>`;
  } else if (state.tab === "dex"){
    body = renderDex();
  } else if (state.tab === "favorites"){
    body = renderFavorites();
  } else {
    body = renderBattle();
  }
  app.innerHTML = favToast()
    + (state.tab==="battle" ? `<div class="battle-top-bar wrap"><span class="mini-title">⚔️ 곤충 배틀 도감</span></div>` : renderHeader())
    + body
    + (state.tab==="battle" ? `<button class="exit-fab" data-exit-battle="1">✕ 나가기</button><button class="rules-fab" data-toggle-rules="1">📖 규칙</button>${renderRulesModal()}` : "")
    + (state.tab==="battle" ? "" : `<footer>${INSECTS.length}종의 곤충 표본 · 대결은 재미를 위한 상상 시뮬레이션이에요<br><a href="admin.html" style="color:#c2b190;text-decoration:underline">⚙️ 관리자</a></footer>`);

  if ((state.tab==="dex" || state.tab==="favorites") && dataSource==="ready"){
    document.getElementById("detailSlot").innerHTML = renderDetailModal(INSECTS.find(i=>i.id===state.dex.detailId));
  }
  if (state.tab==="dex" && dataSource==="ready"){
    const searchEl = document.getElementById("dexSearch");
    if (searchEl){
      searchEl.addEventListener("input", (e)=>{
        state.dex.query = e.target.value;
        document.getElementById("dexGrid").innerHTML = (()=>{
          const list = filteredInsects(state.dex.query, state.dex.orderFilter, null);
          return groupedInsectList(list, i => `data-open-detail="${i.id}"`);
        })();
      });
    }
  }
  const logEl = document.getElementById("battleLog");
  if (logEl){
    if (!logScroll || logScroll.nearBottom){
      logEl.scrollTop = logEl.scrollHeight; // 바닥에 고정
    } else {
      logEl.scrollTop = logScroll.scrollTop; // 사용자가 보던 과거 기록 위치 유지
    }
  }
}

/* ============================== 이벤트 처리 ============================== */
document.addEventListener("click", (e)=>{
  const t = (attr)=> e.target.closest(`[${attr}]`);
  if (e.target.closest("button")) SoundEngine.play("click");

  let el;
  if (el = t("data-set-tab")){
    if (state.tab === "battle" && el.getAttribute("data-set-tab") !== "battle"){ BgMusic.stop(); try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} }
    state.tab = el.getAttribute("data-set-tab"); render(); return;
  }
  if (el = t("data-dex-order")){ state.dex.orderFilter = el.getAttribute("data-dex-order"); render(); return; }
  if (el = t("data-open-detail")){ state.dex.detailId = el.getAttribute("data-open-detail"); render(); return; }
  if (el = t("data-toggle-fav")){ toggleFavorite(el.getAttribute("data-toggle-fav")); return; }

  if (el = t("data-pick-order")){ state.battle.pickOrderFilter = el.getAttribute("data-pick-order"); render(); return; }
  if (el = t("data-set-pick-fav")){ state.battle.pickFavOnly = el.getAttribute("data-set-pick-fav") === "1"; render(); return; }
  if (el = t("data-set-mode")){
    state.battle.mode = el.getAttribute("data-set-mode");
    state.battle.phase = "pick-player";
    state.battle.pickOrderFilter = "all";
    render(); return;
  }
  if (el = t("data-pick-insect")){
    const id = el.getAttribute("data-pick-insect");
    const role = el.getAttribute("data-pick-role");
    const insect = INSECTS.find(i=>i.id===id);
    if (role==="player"){ state.battle.player = insect; state.battle.phase="pick-enemy"; state.battle.pickOrderFilter="all"; state.battle.pickFavOnly=false; }
    else { state.battle.enemy = insect; state.battle.phase="draw-env"; state.battle.env=null; }
    render(); return;
  }
  if (el = t("data-back-to-pick-player")){ state.battle.phase="pick-player"; state.battle.pickOrderFilter="all"; state.battle.pickFavOnly=false; render(); return; }
  if (el = t("data-random-enemy")){
    const others = INSECTS.filter(i=>i.id!==state.battle.player.id);
    state.battle.enemy = others[Math.floor(Math.random()*others.length)];
    state.battle.phase = "draw-env"; state.battle.env = null;
    render(); return;
  }
  if (el = t("data-draw-env")){ drawEnvironment(); return; }
  if (el = t("data-start-battle")){ startBattle(); return; }
  if (el = t("data-use-skill-idx")){
    const side = el.getAttribute("data-use-skill-side");
    const idx = Number(el.getAttribute("data-use-skill-idx"));
    chooseSkill(side, idx);
    return;
  }
  if (el = t("data-continue-handoff")){
    state.battle.turnStage = "p2-choose";
    render();
    maybeAnnounceTurn();
    return;
  }
  if (el = t("data-toggle-rules")){ state.battle.showRules = true; render(); return; }
  if (el = t("data-resolve-round")){ resolveRound(); return; }
  if (el = t("data-exit-battle")){
    BgMusic.stop();
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    state.battle = { mode:null, phase:"mode-select", player:null, enemy:null, env:null, drawing:false, playerHP:0, enemyHP:0, round:1, turnStage:"p1-choose", playerChoice:null, enemyChoice:null, log:[], winner:null, busy:false, pickOrderFilter:"all", pickFavOnly:false, playerMiracleUsed:false, enemyMiracleUsed:false, playerAtkStreak:0, enemyAtkStreak:0, showRules:false };
    state.tab = "dex";
    render(); return;
  }
  if (el = t("data-reset-battle")){
    BgMusic.stop();
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    state.battle = { mode:null, phase:"mode-select", player:null, enemy:null, env:null, drawing:false, playerHP:0, enemyHP:0, round:1, turnStage:"p1-choose", playerChoice:null, enemyChoice:null, log:[], winner:null, busy:false, pickOrderFilter:"all", pickFavOnly:false, playerMiracleUsed:false, enemyMiracleUsed:false, playerAtkStreak:0, enemyAtkStreak:0, showRules:false };
    render(); return;
  }
  if (el = t("data-rematch")){
    BgMusic.stop();
    state.battle.phase="draw-env"; state.battle.env=null; render(); return;
  }
  if (el = t("data-load-fallback")){ INSECTS = FALLBACK_SAMPLE; dataSource="ready"; render(); return; }
});

function drawEnvironment(){
  state.battle.drawing = true;
  render();
  let count = 0;
  const spin = setInterval(()=>{
    state.battle.env = ENV_CARDS[Math.floor(Math.random()*ENV_CARDS.length)];
    render();
    count++;
    if (count > 8){
      clearInterval(spin);
      state.battle.env = ENV_CARDS[Math.floor(Math.random()*ENV_CARDS.length)];
      state.battle.drawing = false;
      render();
    }
  }, 90);
}

function startBattle(){
  const b = state.battle;
  b.playerHP = b.player.stats.hp;
  b.enemyHP = b.enemy.stats.hp;
  const pMods = envModifiers(b.player, b.env);
  const eMods = envModifiers(b.enemy, b.env);
  const intro = [L(`🎬 대결 시작! ${b.player.name} VS ${b.enemy.name}`, "start"), L(`매 턴 공격 또는 방어 기술을 하나씩 골라요. 상대가 뭘 낼지는 모르니 잘 예측해보세요!`)];
  pMods.notes.forEach(n=> intro.push(L(`${b.player.name}: ${n}`)));
  eMods.notes.forEach(n=> intro.push(L(`${b.enemy.name}: ${n}`)));
  b.log = intro;
  b.winner = null;
  b.busy = false;
  b.round = 1;
  b.playerChoice = null;
  b.enemyChoice = null;
  b.turnStage = "p1-choose";
  b.playerMiracleUsed = false;
  b.enemyMiracleUsed = false;
  b.playerAtkStreak = 0;
  b.enemyAtkStreak = 0;
  b.phase = "battling";
  SoundEngine.play("start");
  BgMusic.start();
  render();
  maybeAnnounceTurn();
}

/* 적(컴퓨터) 기술 선택: 체력이 낮으면 절반 확률로 방어 기술을 우선 고려 */
function pickCpuSkill(){
  const b = state.battle;
  const ratio = b.enemyHP / b.enemy.stats.hp;
  const defenseSkills = b.enemy.skills.filter(s => s.type === "defense");
  if (ratio < 0.35 && defenseSkills.length && Math.random() < 0.5){
    return defenseSkills[Math.floor(Math.random() * defenseSkills.length)];
  }
  return b.enemy.skills[Math.floor(Math.random() * b.enemy.skills.length)];
}

function chooseSkill(side, idx){
  const b = state.battle;
  if (b.busy) return;
  if (side === "player" && b.turnStage !== "p1-choose") return;
  if (side === "enemy" && b.turnStage !== "p2-choose") return;

  if (side === "player"){
    b.playerChoice = b.player.skills[idx];
    if (b.mode === "pvc"){
      b.turnStage = "cpu-thinking";
      b.busy = true;
      render();
      setTimeout(() => {
        b.enemyChoice = pickCpuSkill();
        b.turnStage = "resolving";
        b.busy = false;
        render();
      }, 700);
    } else {
      b.turnStage = "handoff";
      render();
    }
  } else {
    b.enemyChoice = b.enemy.skills[idx];
    b.turnStage = "resolving";
    render();
  }
}

/* 공격 기술이 방어 기술과 맞붙었을 때: 명중판정→크리티컬→회피 순으로 처리 */
function resolveAttackVsDefense(ctx, attackerSide){
  const b = state.battle;
  const atk = attackerSide === "player" ? b.player : b.enemy;
  const def = attackerSide === "player" ? b.enemy : b.player;
  const atkSkill = attackerSide === "player" ? ctx.pSkill : ctx.eSkill;
  const defSkill = attackerSide === "player" ? ctx.eSkill : ctx.pSkill;
  const atkMods = attackerSide === "player" ? ctx.pMods : ctx.eMods;
  const defMods = attackerSide === "player" ? ctx.eMods : ctx.pMods;
  const atkSpdEff = attackerSide === "player" ? ctx.pSpd : ctx.eSpd;
  const defSpdEff = attackerSide === "player" ? ctx.eSpd : ctx.pSpd;
  const icon = attackerSide === "player" ? "🦋" : "🐜";

  const outcome = computeAttackRoll(atk, def, b.env, atkSkill);
  let finalDmg = 0;

  if (outcome === "miss"){
    ctx.log.push(L(`${icon} ${atk.name}의 「${atkSkill.name}」! 완전히 빗나갔다! (${def.name}는 「${defSkill.name}」로 여유롭게 버텼다)`, "miss"));
  } else {
    let dmg = calcDamage(atk, def, atkSkill, atkMods.atkMult, defMods.defMult);
    const crit = rollCrit(atk, def, b.env);
    if (crit) dmg = Math.round(dmg * 1.5);
    if (outcome === "graze") dmg = Math.round(dmg * 0.5);
    const dodged = rollDodge(def, b.env, defSpdEff, atkSpdEff, defSkill);

    if (dodged){
      ctx.log.push(L(`🛡️ ${atk.name}의 「${atkSkill.name}」! ${def.name}가 「${defSkill.name}」로 완전히 피했다!`, "dodge"));
    } else {
      finalDmg = Math.max(1, Math.round(dmg * 0.35));
      applyDamageWithMiracle(ctx, attackerSide === "player" ? "enemy" : "player", finalDmg);
      const grazeText = outcome === "graze" ? "스치듯 맞아 " : "";
      ctx.log.push(L(`${icon} ${atk.name}의 「${atkSkill.name}」!${crit ? " 💥 급소를 노렸지만" : ""} ${def.name}가 「${defSkill.name}」로 ${grazeText}대부분 막아내고 ${finalDmg}의 피해만 입었다.`, crit ? "crit" : "hit"));
    }
  }

  if (atkSkill.selfDamage){
    if (attackerSide === "player") ctx.pHP = Math.max(0, ctx.pHP - atkSkill.selfDamage);
    else ctx.eHP = Math.max(0, ctx.eHP - atkSkill.selfDamage);
    ctx.log.push(L(`   … ${atk.name}도 ${atkSkill.selfDamage}만큼 힘이 빠졌다.`, "fatigue"));
  }
  if (atkSkill.heal && finalDmg > 0){
    if (attackerSide === "player") ctx.pHP = Math.min(b.player.stats.hp, ctx.pHP + atkSkill.heal);
    else ctx.eHP = Math.min(b.enemy.stats.hp, ctx.eHP + atkSkill.heal);
    ctx.log.push(L(`   … ${atk.name}가 체력을 ${atkSkill.heal} 회복했다.`, "heal"));
  }
  const defHeal = effectiveDefenseHeal(def, defSkill);
  if (defHeal){
    if (attackerSide === "player") ctx.eHP = Math.min(b.enemy.stats.hp, ctx.eHP + defHeal);
    else ctx.pHP = Math.min(b.player.stats.hp, ctx.pHP + defHeal);
    ctx.log.push(L(`   … ${def.name}가 방어하며 체력을 ${defHeal} 회복했다.`, "heal"));
  }
}

/* 이번 라운드에 서로 고른 기술을 공개하고 결과를 계산 */
function resolveRound(){
  const b = state.battle;
  if (b.busy) return; // 중복 클릭 방지
  b.busy = true;
  const pMods = envModifiers(b.player, b.env);
  const eMods = envModifiers(b.enemy, b.env);
  const ctx = {
    pSkill: b.playerChoice, eSkill: b.enemyChoice,
    pMods, eMods,
    pSpd: b.player.stats.spd * pMods.spdMult,
    eSpd: b.enemy.stats.spd * eMods.spdMult,
    pHP: b.playerHP, eHP: b.enemyHP,
    log: [L(`🔓 공개! ${b.player.name}: 「${b.playerChoice.name}」 vs ${b.enemy.name}: 「${b.enemyChoice.name}」`, "reveal")],
  };

  if (ctx.pSkill.type === "attack" && ctx.eSkill.type === "attack"){
    const outcomeP = computeAttackRoll(b.player, b.enemy, b.env, ctx.pSkill);
    const outcomeE = computeAttackRoll(b.enemy, b.player, b.env, ctx.eSkill);
    let dmgP = 0, dmgE = 0;

    if (outcomeP === "miss"){
      ctx.log.push(L(`🦋 ${b.player.name}의 「${ctx.pSkill.name}」! 완전히 빗나갔다!`, "miss"));
    } else {
      dmgP = calcDamage(b.player, b.enemy, ctx.pSkill, pMods.atkMult, eMods.defMult);
      const critP = rollCrit(b.player, b.enemy, b.env);
      if (critP) dmgP = Math.round(dmgP * 1.5);
      if (outcomeP === "graze") dmgP = Math.round(dmgP * 0.5);
      ctx.log.push(L(`🦋 ${b.player.name}의 「${ctx.pSkill.name}」!${critP ? " 💥 급소 공격!" : ""}${outcomeP === "graze" ? " (스치듯 맞음)" : ""} ${b.enemy.name}에게 ${dmgP}의 피해!`, critP ? "crit" : "hit"));
    }
    if (outcomeE === "miss"){
      ctx.log.push(L(`🐜 ${b.enemy.name}의 「${ctx.eSkill.name}」! 완전히 빗나갔다!`, "miss"));
    } else {
      dmgE = calcDamage(b.enemy, b.player, ctx.eSkill, eMods.atkMult, pMods.defMult);
      const critE = rollCrit(b.enemy, b.player, b.env);
      if (critE) dmgE = Math.round(dmgE * 1.5);
      if (outcomeE === "graze") dmgE = Math.round(dmgE * 0.5);
      ctx.log.push(L(`🐜 ${b.enemy.name}의 「${ctx.eSkill.name}」!${critE ? " 💥 급소 공격!" : ""}${outcomeE === "graze" ? " (스치듯 맞음)" : ""} ${b.player.name}에게 ${dmgE}의 피해!`, critE ? "crit" : "hit"));
    }
    applyDamageWithMiracle(ctx, "enemy", dmgP);
    applyDamageWithMiracle(ctx, "player", dmgE);
    [["player",ctx.pSkill,dmgP],["enemy",ctx.eSkill,dmgE]].forEach(([side,skill,dmg]) => {
      const actor = side==="player" ? b.player : b.enemy;
      if (skill.selfDamage){
        if (side==="player") ctx.pHP = Math.max(0, ctx.pHP - skill.selfDamage); else ctx.eHP = Math.max(0, ctx.eHP - skill.selfDamage);
        ctx.log.push(L(`   … ${actor.name}도 ${skill.selfDamage}만큼 힘이 빠졌다.`, "fatigue"));
      }
      if (skill.heal && dmg > 0){
        if (side==="player") ctx.pHP = Math.min(b.player.stats.hp, ctx.pHP + skill.heal); else ctx.eHP = Math.min(b.enemy.stats.hp, ctx.eHP + skill.heal);
        ctx.log.push(L(`   … ${actor.name}가 체력을 ${skill.heal} 회복했다.`, "heal"));
      }
    });
  } else if (ctx.pSkill.type === "attack" && ctx.eSkill.type === "defense"){
    resolveAttackVsDefense(ctx, "player");
  } else if (ctx.pSkill.type === "defense" && ctx.eSkill.type === "attack"){
    resolveAttackVsDefense(ctx, "enemy");
  } else {
    const healP = effectiveDefenseHeal(b.player, ctx.pSkill) || Math.round(b.player.stats.hp * 0.08);
    const healE = effectiveDefenseHeal(b.enemy, ctx.eSkill) || Math.round(b.enemy.stats.hp * 0.08);
    ctx.pHP = Math.min(b.player.stats.hp, ctx.pHP + healP);
    ctx.eHP = Math.min(b.enemy.stats.hp, ctx.eHP + healE);
    ctx.log.push(L(`🛡️ 둘 다 방어만 하며 견제하다 끝났다. ${b.player.name}은 체력 ${healP}, ${b.enemy.name}는 체력 ${healE}을 회복했다.`, "heal"));
  }

  /* 연속 공격 스트릭 갱신 + 피로 페널티 (공격을 거듭 낼수록 조금씩 지침, 죽지는 않음) */
  b.playerAtkStreak = ctx.pSkill.type === "attack" ? (b.playerAtkStreak || 0) + 1 : 0;
  b.enemyAtkStreak = ctx.eSkill.type === "attack" ? (b.enemyAtkStreak || 0) + 1 : 0;
  if (ctx.pSkill.type === "attack") applyFatigue(ctx, "player", b.playerAtkStreak);
  if (ctx.eSkill.type === "attack") applyFatigue(ctx, "enemy", b.enemyAtkStreak);

  b.playerHP = ctx.pHP;
  b.enemyHP = ctx.eHP;

  let onRevealDone;
  if (b.enemyHP <= 0 || b.playerHP <= 0){
    const w = (b.enemyHP<=0 && b.playerHP<=0) ? "무승부" : (b.enemyHP<=0 ? b.player.name : b.enemy.name);
    b.winner = w;
    ctx.log.push(L(w==="무승부" ? "🤝 무승부!" : `🏆 ${w}의 승리!`, w==="무승부" ? "draw" : "win"));
    onRevealDone = () => { b.phase = "result"; b.busy = false; render(); };
  } else {
    onRevealDone = () => {
      b.round++;
      b.playerChoice = null;
      b.enemyChoice = null;
      b.turnStage = "p1-choose";
      b.busy = false;
      render();
      maybeAnnounceTurn();
    };
  }
  revealLogQueue(ctx.log, onRevealDone);
}

/* 로그를 한 줄씩 순차적으로 화면에 띄우면서, 줄마다 어울리는 효과음을 재생 */
function revealLogQueue(queue, onDone){
  const b = state.battle;
  b.busy = true;
  let i = 0;
  function step(){
    if (i >= queue.length){ onDone(); return; }
    const entry = queue[i++];
    b.log = [...b.log, entry];
    SoundEngine.play(entry.sound);
    render();
    setTimeout(step, 550);
  }
  step();
}

/* 지금 누구 차례인지 음성으로 안내 (지원 안 하는 기기/브라우저는 조용히 무시됨) */
function maybeAnnounceTurn(){
  const b = state.battle;
  if (b.phase !== "battling") return;
  if (b.turnStage === "p1-choose"){
    announce(b.mode === "pvp" ? "플레이어 1, 기술을 고르세요" : "기술을 골라보세요");
  } else if (b.turnStage === "p2-choose"){
    announce("플레이어 2, 기술을 고르세요");
  }
}

/* ============================== 데이터 로드 & 시작 ============================== */
async function loadData(){
  try{
    const res = await fetch("insects.json");
    if (!res.ok) throw new Error("bad status");
    const json = await res.json();
    INSECTS = json.insects.filter(i=> i && i.id && !i.id.startsWith("_"));
    dataSource = "ready";
  }catch(e){
    dataSource = "error";
  }
  render();
}
render();
loadData();
</script>
